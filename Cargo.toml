[package]
name = "griasdi-gstreamer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/griasdi/gstreamer"
description = "Builds GStreamer and its C dependencies for griasdi and packages the result with its source"
publish = false

[dependencies]
anyhow = "1"
# The two archives of a release: .tar.gz, written (and read back in a test).
flate2 = "1"
tar = "0.4"
# The pinned downloads' and the archives' checksums.
sha2 = "0.10"
# meson's introspection files, which say what was built (licenses.rs).
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
